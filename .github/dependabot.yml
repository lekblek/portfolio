# Mises à jour de dépendances proposées chaque semaine en pull request vers develop (D-DI), vérifiées par la CI.
# Mineures et correctifs groupés par écosystème ; une montée majeure reste une pull request isolée.
# Exclus : ce qui suit une procédure documentée plutôt qu'une simple montée de version (03-versions-cibles.md).
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Majeure d'Angular : `ng update`, qui applique les migrations du code (§7).
      - dependency-name: "@angular/*"
        update-types: [version-update:semver-major]
      # TypeScript suit la plage prise en charge par Angular (§8) ; @types/node suit Node.js (.nvmrc, §6.1).
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /deploy
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Même image en développement, en test et en production, changée ensemble (§10.3).
      - dependency-name: postgres
