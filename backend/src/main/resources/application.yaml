# Configuration commune à tous les profils.
# Aucun profil n'est activé ici : le profil se choisit au lancement
# (dev : -Dspring-boot.run.profiles=dev ou configuration de l'IDE ; tests : @ActiveProfiles("test")).
spring:
  application:
    name: portfolio-backend
  autoconfigure:
    # Pas d'utilisateur généré (ni mot de passe dans les journaux) : le compte administrateur unique arrive à
    # l'étape 33 ; d'ici là, aucune authentification n'est possible (D-CK).
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        # Taille de page maximale pour toute l'API (ApiPaging.MAX_PAGE_SIZE, 05-conventions-api.md §13) :
        # une valeur supérieure est ramenée à ce plafond. La taille par défaut se déclare par contrôleur.
        max-page-size: 100
  servlet:
    multipart:
      # Envoi d'un média (D-CT) : 10 Mio au plus, la plus grande taille acceptée (PDF, D-BR) ; la limite propre à
      # chaque format reste vérifiée par UploadMediaUseCase.
      max-file-size: 10MB
      max-request-size: 11MB
  mail:
    # Notification des messages de contact (D-CI). Par défaut : Mailpit de deploy/compose.dev.yaml.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      # Un serveur SMTP lent ne doit pas bloquer indéfiniment la requête qui a enregistré le message.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  # Mandataire inverse (Caddy, D-DC) : adresse du client et schéma lus dans X-Forwarded-For et X-Forwarded-Proto, mais
  # seulement pour une requête venant d'un réseau de confiance (server.tomcat.remoteip.internal-proxies ; par défaut
  # les réseaux privés et la boucle locale, où tourne le mandataire). Un client d'Internet ne peut donc pas falsifier
  # son adresse, qui sert à la limite des essais de connexion.
  forward-headers-strategy: native
  tomcat:
    # Une requête multipart trop grande est refusée avant d'être lue ; Tomcat en lit puis ignore jusqu'à 12 Mio pour
    # que le navigateur reçoive la 413. Au-delà, la connexion est coupée (D-CT).
    max-swallow-size: 12MB
  servlet:
    context-path: /api
    session:
      # Session de l'administrateur (D-CR) : 30 minutes d'inactivité. Cookie jamais lisible par JavaScript, envoyé
      # seulement en HTTPS (les navigateurs acceptent aussi http://localhost) et seulement depuis le site lui-même ;
      # le cookie XSRF-TOKEN reprend secure et same-site (SecurityConfiguration).
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: strict

portfolio:
  media:
    # Racine du stockage local des médias (D-BO) : relative au répertoire de travail en développement,
    # volume persistant en production (étape 52).
    storage-root: ${MEDIA_STORAGE_ROOT:uploads}
  admin:
    # Compte administrateur unique (D18, D-CN) : la configuration fait foi à chaque démarrage. Vides : non initialisé.
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
  contact:
    notification:
      # Expéditeur et destinataire (l'administrateur) des notifications de contact (D-CI).
      from: ${MAIL_FROM:portfolio@localhost}
      to: ${MAIL_TO:admin@localhost}

# Documentation OpenAPI et Swagger UI : profil dev seulement (KI-19, D-CK).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  health:
    mail:
      # Une panne SMTP ne rend pas l'application indisponible : la notification est accessoire (D14, D-CJ).
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    # Identifiant de la requête (RequestIdFilter, D-DB) après le niveau de chaque ligne ; vide hors requête HTTP.
    level: "%5p [%X{requestId:-}]"
  level:
    # Un refus d'intégrité (unicité, clé étrangère) est traduit en 409 ou 400 par l'adaptateur : l'avertissement
    # d'Hibernate, qui recopie les valeurs saisies, n'apporte que du bruit et des données (D-DB). Visible en dev.
    org.hibernate.orm.jdbc.error: error
