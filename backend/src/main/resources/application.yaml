# Configuration commune à tous les profils.
# Aucun profil n'est activé ici : le profil se choisit au lancement
# (dev : -Dspring-boot.run.profiles=dev ou configuration de l'IDE ; tests : @ActiveProfiles("test")).
spring:
  application:
    name: portfolio-backend
  autoconfigure:
    # Pas d'utilisateur généré (ni mot de passe dans les journaux) : le compte administrateur unique arrive à
    # l'étape 33 ; d'ici là, aucune authentification n'est possible (D-CK).
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        # Taille de page maximale pour toute l'API (ApiPaging.MAX_PAGE_SIZE, 05-conventions-api.md §13) :
        # une valeur supérieure est ramenée à ce plafond. La taille par défaut se déclare par contrôleur.
        max-page-size: 100
  mail:
    # Notification des messages de contact (D-CI). Par défaut : Mailpit de deploy/compose.dev.yaml.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      # Un serveur SMTP lent ne doit pas bloquer indéfiniment la requête qui a enregistré le message.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  servlet:
    context-path: /api
    session:
      # Session de l'administrateur (D-CR) : 30 minutes d'inactivité. Cookie jamais lisible par JavaScript, envoyé
      # seulement en HTTPS (les navigateurs acceptent aussi http://localhost) et seulement depuis le site lui-même ;
      # le cookie XSRF-TOKEN reprend secure et same-site (SecurityConfiguration).
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: strict

portfolio:
  media:
    # Racine du stockage local des médias (D-BO) : relative au répertoire de travail en développement,
    # volume persistant en production (étape 52).
    storage-root: ${MEDIA_STORAGE_ROOT:uploads}
  admin:
    # Compte administrateur unique (D18, D-CN) : la configuration fait foi à chaque démarrage. Vides : non initialisé.
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
  contact:
    notification:
      # Expéditeur et destinataire (l'administrateur) des notifications de contact (D-CI).
      from: ${MAIL_FROM:portfolio@localhost}
      to: ${MAIL_TO:admin@localhost}

# Documentation OpenAPI et Swagger UI : profil dev seulement (KI-19, D-CK).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  health:
    mail:
      # Une panne SMTP ne rend pas l'application indisponible : la notification est accessoire (D14, D-CJ).
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
