# Configuration commune à tous les profils.
# Aucun profil n'est activé ici : le profil se choisit au lancement
# (dev : -Dspring-boot.run.profiles=dev ou configuration de l'IDE ; tests : @ActiveProfiles("test")).
spring:
  application:
    name: portfolio-backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
