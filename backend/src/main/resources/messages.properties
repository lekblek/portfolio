# Détails (RFC 9457) des erreurs produites par Spring MVC, en français comme le reste de l'API (D-DJ).
# Clé : problemDetail.<classe de l'exception> ; {0}, {1} : arguments fournis par l'exception.
# Pas d'apostrophe : le texte passe par MessageFormat, qui l'interpréterait.
problemDetail.org.springframework.web.bind.MethodArgumentNotValidException=Certaines valeurs de la requête sont invalides.
problemDetail.org.springframework.web.method.annotation.HandlerMethodValidationException=Certaines valeurs de la requête sont invalides.
problemDetail.org.springframework.web.bind.MissingServletRequestParameterException=Paramètre obligatoire absent : {0}.
problemDetail.org.springframework.web.multipart.support.MissingServletRequestPartException=Partie obligatoire absente : {0}.
problemDetail.org.springframework.web.bind.MissingRequestHeaderException=En-tête obligatoire absent : {0}.
problemDetail.org.springframework.beans.TypeMismatchException=Valeur invalide pour {0}.
problemDetail.org.springframework.http.converter.HttpMessageNotReadableException=Corps de la requête illisible.
problemDetail.org.springframework.web.HttpRequestMethodNotSupportedException=Méthode {0} non prise en charge par cette adresse.
problemDetail.org.springframework.web.HttpMediaTypeNotSupportedException=Type de contenu non pris en charge.
problemDetail.org.springframework.web.HttpMediaTypeNotAcceptableException=Aucune représentation acceptable pour cette requête.
problemDetail.org.springframework.web.servlet.resource.NoResourceFoundException=Ressource introuvable.
problemDetail.org.springframework.web.servlet.NoHandlerFoundException=Ressource introuvable.
problemDetail.org.springframework.http.converter.HttpMessageNotWritableException=Une erreur inattendue est survenue.
problemDetail.org.springframework.beans.ConversionNotSupportedException=Une erreur inattendue est survenue.
