spring:
  config:
    # deploy/.env est lu depuis la racine du dépôt ou depuis backend/ (répertoire de travail).
    import:
      - optional:file:./deploy/.env[.properties]
      - optional:file:../deploy/.env[.properties]

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:portfolio}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: false

  mail:
    # Mailpit de deploy/compose.dev.yaml (D-CI, D-DD) : reçoit les notifications sans rien envoyer.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

portfolio:
  media:
    # Relatif au répertoire de travail (ignoré par Git), ou MEDIA_STORAGE_ROOT (D-DD).
    storage-root: ${MEDIA_STORAGE_ROOT:uploads}
  contact:
    notification:
      from: ${MAIL_FROM:portfolio@localhost}
      to: ${MAIL_TO:admin@localhost}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    # Développement : message et pile complets d'une erreur 500, avertissements SQL d'Hibernate (D-DB).
    com.scalke.portfolio.backend.shared.api.GlobalExceptionHandler: debug
    org.hibernate.orm.jdbc.error: warn
