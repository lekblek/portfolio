spring:
  jpa:
    properties:
      hibernate:
        format_sql: true
        # SQL journalisé une seule fois, par le logger org.hibernate.SQL ci-dessous (pas de show_sql).
        # Compteur de requêtes utilisé par GetProfileUseCaseIT (D-O). Profil test uniquement.
        generate_statistics: true
  flyway:
    enabled: true

portfolio:
  media:
    # Répertoire jetable sous target/ ; les tests y déposent leurs fichiers et les suppriment.
    storage-root: target/test-media

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.testcontainers: INFO
    com.github.dockerjava: WARN
    org.hibernate.SQL: DEBUG
    # generate_statistics journalise des métriques à chaque session : inutile ici.
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: WARN
