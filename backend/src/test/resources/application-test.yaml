spring:
  jpa:
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        # Compteur de requêtes utilisé par GetProfileUseCaseIT (D-O). Profil test uniquement.
        generate_statistics: true
  flyway:
    enabled: true

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.testcontainers: INFO
    com.github.dockerjava: WARN
    org.hibernate.SQL: DEBUG
    # generate_statistics journalise des métriques à chaque session : inutile ici.
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: WARN
